name: Refresh blueprint

# Regenerates the exam domain (spec/blueprint.json) from the official source page using AI
# and opens a PULL REQUEST when it changes. Manual only: this workflow can spend Bedrock tokens.
# Requires AWS OIDC role AWS_BEDROCK_REFRESH_ROLE_ARN and explicit confirm_ai_spend=true.
# A no-diff refresh is an explicit SUCCESS and never runs the PR finalizer (#73).
# pr_plumbing_test=true exercises ONLY the PR finalizer with a synthetic change — no AWS, no spend.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Source URL to extract the domain from (defaults to the exam URL)
        required: false
      confirm_ai_spend:
        description: I understand this workflow invokes AWS Bedrock and can spend tokens
        required: true
        type: boolean
        default: false
      pr_plumbing_test:
        description: Exercise the PR finalizer with a synthetic change (no Bedrock, no AWS, no spend)
        required: false
        type: boolean
        default: false
      smoke_only:
        description: Run EXACTLY ONE standard-tier Converse smoke (maxTokens=8) under the refresh role and stop — no refresh, no PR (still requires confirm_ai_spend)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_BEDROCK_REFRESH_ROLE_ARN: ${{ secrets.AWS_BEDROCK_REFRESH_ROLE_ARN }}
      BEDROCK_MODEL_STANDARD: ${{ vars.BEDROCK_MODEL_STANDARD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR finalizer authenticates with its own token; persisting the checkout credential
          # caused a "Duplicate header: Authorization" git failure inside create-pull-request (#73).
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check Bedrock refresh gate
        id: gate
        env:
          CONFIRM_AI_SPEND: ${{ github.event.inputs.confirm_ai_spend }}
          PR_PLUMBING_TEST: ${{ github.event.inputs.pr_plumbing_test }}
        run: |
          if [ "$PR_PLUMBING_TEST" = "true" ]; then
            echo "PR plumbing test: skipping every AWS/Bedrock step; exercising only the PR finalizer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "plumbing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "plumbing=false" >> "$GITHUB_OUTPUT"
          if [ "$CONFIRM_AI_SPEND" != "true" ]; then
            echo "confirm_ai_spend=true is required because blueprint refresh invokes AWS Bedrock."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$AWS_BEDROCK_REFRESH_ROLE_ARN" ]; then
            echo "AWS_BEDROCK_REFRESH_ROLE_ARN secret is required to assume the Bedrock refresh role."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
      - name: Configure AWS credentials for Bedrock
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BEDROCK_REFRESH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Standard-tier smoke (exactly one Converse call, then STOP)
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.smoke_only == 'true'
        run: |
          set -euo pipefail
          # Fail closed on IDENTITY: this smoke proves the REFRESH ROLE path, nothing else.
          CALLER=$(aws sts get-caller-identity --query Arn --output text)
          MASKED=$(printf '%s' "$CALLER" | sed -E 's/[0-9]{12}/ACCOUNT/g')
          case "$CALLER" in
            *assumed-role/cba-study-coach-gha-bedrock-refresh/*) : ;;
            *) echo "REFUSED: identity is not the refresh role: $MASKED"; exit 1 ;;
          esac
          # Fail closed on MODEL: exactly the approved standard profile — no fallback, ever.
          if [ "$BEDROCK_MODEL_STANDARD" != "us.anthropic.claude-sonnet-5" ]; then
            echo "REFUSED: BEDROCK_MODEL_STANDARD diverges from the approved standard profile"; exit 1
          fi
          # EXACTLY ONE invocation. No retry: any non-zero exit stops here (set -e).
          STOP=$(aws bedrock-runtime converse --region "$AWS_REGION" --model-id "$BEDROCK_MODEL_STANDARD" \
            --messages '[{"role":"user","content":[{"text":"Reply with exactly: ok"}]}]' \
            --inference-config '{"maxTokens":8}' --query stopReason --output text)
          echo "SMOKE EVIDENCE"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "identity=$MASKED (refresh role confirmed)"
          echo "region=$AWS_REGION"
          echo "model=$BEDROCK_MODEL_STANDARD"
          echo "stopReason=$STOP"
          echo "attempts=1"
      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.smoke_only != 'true'
        run: npm ci
      - name: Regenerate the domain from the source page
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.smoke_only != 'true'
        env:
          FROM_URL: ${{ github.event.inputs.url }}
          LLM_BACKEND: bedrock
        run: |
          if [ -n "$FROM_URL" ]; then
            node bin/cli.js blueprint --provider anthropic --from "$FROM_URL" --write
          else
            node bin/cli.js blueprint --provider anthropic --write
          fi
      - name: Check the bank against the (possibly) new domain
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.smoke_only != 'true'
        run: node bin/cli.js validate || echo "::warning::bank no longer validates against the regenerated domain — review the PR carefully"
      - name: Write a synthetic change (plumbing test only)
        if: steps.gate.outputs.plumbing == 'true' && github.event.inputs.smoke_only != 'true'
        run: |
          printf 'blueprint-refresh PR finalizer self-test — run %s\n' "$GITHUB_RUN_ID" \
            > .github/blueprint-refresh-selftest.txt
          echo "Synthetic change written (no Bedrock, no AWS)."
      - name: Detect a tracked change
        id: diff
        if: (steps.gate.outputs.skip != 'true' || steps.gate.outputs.plumbing == 'true') && github.event.inputs.smoke_only != 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Domain change detected — the PR finalizer will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✓ No domain change — refresh completed successfully; no PR needed."
          fi
      - name: Open a PR if the domain changed
        if: >-
          (steps.gate.outputs.skip != 'true' || steps.gate.outputs.plumbing == 'true')
          && steps.diff.outputs.changed == 'true'
          && github.event.inputs.smoke_only != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ github.event.inputs.pr_plumbing_test == 'true' && 'chore/blueprint-refresh-selftest' || 'chore/blueprint-refresh' }}
          delete-branch: true
          title: "${{ github.event.inputs.pr_plumbing_test == 'true' && 'Self-test: blueprint-refresh PR finalizer (close me)' || 'Refresh exam domain from the source page' }}"
          commit-message: "${{ github.event.inputs.pr_plumbing_test == 'true' && 'chore: blueprint-refresh PR finalizer self-test' || 'chore: refresh spec/blueprint.json from the source page' }}"
          labels: roadmap
          body: |
            Automated regeneration of the exam domain (`spec/blueprint.json`) from the official page.

            Review the diff carefully: domains, weights, and competencies must match the source.
            If a domain was **renamed**, existing question IDs/prefixes may need updating too — check
            the `validate` output in the run logs before merging.

            (If this is a `pr_plumbing_test` self-test PR, it only touches
            `.github/blueprint-refresh-selftest.txt` — close it without merging.)
