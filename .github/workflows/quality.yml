name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          # Round I1-4: the default single-commit checkout makes HEAD~1 unavailable, and the
          # spec system's historical laws would silently degrade to "registry birth". Full
          # history keeps them enforced; the linter also fails closed on shallow clones.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run CLI tests
        run: npm test
      - name: Spec traceability lint (SHA-bound)
        run: npm run spec:lint -- --commit "$(git rev-parse HEAD)"
      - name: Spec conformance (SHA-bound)
        run: npm run spec:conform -- --commit "$(git rev-parse HEAD)"
      - name: Validate question bank
        run: node bin/cli.js validate
      - name: Check bank coverage
        run: node bin/cli.js stats
      - name: Check generator prompt
        run: node bin/cli.js generate --domain catalog --count 1 --dry-run > /tmp/cba-generate-prompt.txt
      - name: Check npm package contents
        run: npm pack --dry-run
      - name: Audit source links
        if: matrix.node-version == 22
        run: node bin/cli.js audit-sources
