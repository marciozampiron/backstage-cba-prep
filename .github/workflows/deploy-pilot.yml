# Deploy lane skeleton (#70 Slice A) — preflight and gates only. NOTHING IS DEPLOYED YET.
#
# Slice A delivers the ordering and the refusals. The `cdk deploy` invocation, the Cloudflare
# deploy and the post-deploy smoke gates belong to later #70 slices, and this file is shaped so
# that adding them cannot bypass what is here:
#
#   preflight  ->  (human approval on the GitHub Environment)  ->  deploy
#
# WHY MANUAL-ONLY. `workflow_dispatch` is the sole trigger. A `push` trigger on this lane would mean
# a merge to `main` could spend money and mutate an account without anyone choosing to, which is the
# opposite of every gate in this repository. Automation may be added later only with its own review.
#
# WHY THE PREFLIGHT IS A SEPARATE JOB. A step inside the deploy job could be reordered, made
# `continue-on-error`, or skipped by an `if:` without anything noticing. A separate job named in
# `needs:` cannot: GitHub will not start the dependent job when it fails. `test/deploy-pilot-
# workflow.test.js` asserts that every job which can run `cdk deploy` lists `preflight` in `needs`,
# and proves that assertion bites by mutating this file in memory.
#
# WHY THE ENVIRONMENT IS NAMED ON THE DEPLOY JOB. GitHub Environment protection rules are what turn
# "a human should approve" into "the job does not start until a human approves". The reviewers and
# the deployment branch policy are configured in repository settings, not here — that is deliberate:
# a workflow file cannot grant itself an approver.
#
# NO SECRETS ARE COMMITTED. The role ARN and region come from Environment-scoped variables, so `dev`
# and `pilot` resolve to different accounts/roles without either value appearing in a tracked file.
name: Deploy Pilot

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment tier'
        required: true
        type: choice
        options:
          - dev
          - pilot
      auth_callback_urls:
        description: 'JSON array of exact Cognito callback URLs (PREFLIGHT-1 refuses the .invalid placeholder)'
        required: true
        type: string
      auth_logout_urls:
        description: 'JSON array of exact Cognito logout URLs'
        required: true
        type: string
      auth_domain_prefix:
        description: 'Cognito hosted-UI domain prefix — must be supplied explicitly (PREFLIGHT-2)'
        required: true
        type: string
      expected_user_pool_id:
        description: 'Existing user pool id, when redeploying onto a domain we already own'
        required: false
        type: string

# Least privilege at the top level; the preflight job adds `id-token` for OIDC and nothing else.
permissions:
  contents: read

# One deploy at a time per environment. Two concurrent runs against the same account is how a
# half-applied stack meets another one.
concurrency:
  group: deploy-pilot-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # PREFLIGHT — the two binding conditions #69 registered against #70.
  #
  # PREFLIGHT-1: refuse while `.invalid` survives into the EFFECTIVE callback/logout URLs.
  # PREFLIGHT-2: refuse unless `authDomainPrefix` was explicitly supplied AND confirmed unique
  #              in the target region.
  #
  # Both are evaluated by `infra/aws/bin/deploy-preflight.js`, which exits non-zero on refusal. The
  # only AWS call it makes is a read-only `cognito-idp describe-user-pool-domain`.
  # ---------------------------------------------------------------------------------------------
  preflight:
    name: Deploy preflight (PREFLIGHT-1 / PREFLIGHT-2)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (context helpers and preflight)
        run: npm test
      - name: Configure AWS credentials (read-only preflight role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Evaluate PREFLIGHT-1 and PREFLIGHT-2
        env:
          CALLBACK_URLS: ${{ inputs.auth_callback_urls }}
          LOGOUT_URLS: ${{ inputs.auth_logout_urls }}
          DOMAIN_PREFIX: ${{ inputs.auth_domain_prefix }}
          EXPECTED_POOL: ${{ inputs.expected_user_pool_id }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          args=(--environment "$TARGET_ENV" --region "$TARGET_REGION"
                -c "authCallbackUrls=$CALLBACK_URLS"
                -c "authLogoutUrls=$LOGOUT_URLS"
                -c "authDomainPrefix=$DOMAIN_PREFIX")
          if [ -n "$EXPECTED_POOL" ]; then
            args+=(--expected-user-pool-id "$EXPECTED_POOL")
          fi
          node bin/deploy-preflight.js "${args[@]}"

  # ---------------------------------------------------------------------------------------------
  # DEPLOY — SLICE A PLACEHOLDER. It runs no `cdk deploy` and mutates nothing.
  #
  # It exists now so the ordering and the human gate are established and asserted BEFORE any
  # deploying step is written. A later slice replaces the placeholder step; it inherits
  # `needs: preflight` and the Environment gate, and the invariant test refuses the file if a
  # future edit detaches them.
  # ---------------------------------------------------------------------------------------------
  deploy:
    name: Deploy (not implemented in Slice A)
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Slice A stops here
        run: |
          echo "Preflight passed for '${{ inputs.environment }}'."
          echo "Slice A implements no deployment step: no AWS stack, no Cloudflare Worker,"
          echo "no account mutation and no paid call happened in this run."
