# Release orchestrator (#70) — release identity, preflight, binding, gates and the DEV deploy.
# SLICE B1: the dev stage deploys AWS through the sanctioned entrypoint. PILOT DEPLOYS NOTHING —
# promotion is MECHANICALLY BLOCKED: `mode` offers only `dev_only`, so the pilot jobs (whose
# success expressions require `dev_then_pilot`) are unreachable until O1/O2, the deployed smokes
# and the live SNS/KMS notification proof are implemented in later slices.
#
# Shaped by `docs/architecture/deployed-environment-smoke-workflow-design.md` §1 and §4. Slice A
# delivers the identity, the ordering, the binding and the refusals; the deploys, the F1/F2 gates
# and the smoke lane are later slices that plug into this DAG without loosening it.
#
#   global-preflight  ->  dev-preflight  ->  dev-stage  ->  pilot-preflight  ->  pilot-stage
#   (release identity)    (env: dev)         (env: dev)     (env: pilot,        (env: pilot)
#                                                            mode-gated)
#
# RELEASE IDENTITY. `release_sha` must be exactly 40 lowercase hex characters — validated in pure
# shell BEFORE any git invocation, because a 40-character BRANCH NAME that starts with a hex digit
# would otherwise reach git as a revision, get blessed as an ancestor, and then be MOVED before a
# later job resolved the same name again. The identity job proves the object is a commit, requires
# it to resolve to itself, checks ancestry from live main, and emits the RESOLVED OID. Every later
# job pins its checkout to that output; the raw input is never used as a checkout ref anywhere.
#
# BINDING. A preflight that merely exits zero proves that SOME configuration was valid — not that
# the deploy uses it. The preflight therefore synthesizes the cloud assembly from the bound context
# and emits a manifest whose digests cover the release OID, the environment, the REGION, the TARGET
# ACCOUNT, EVERY deploy-sensitive context value (the closed contract in infra/aws/lib/context.js)
# and the synthesized assembly itself. Stage jobs verify that manifest with a purpose-built command.
# Deployment happens ONLY through `infra/aws/bin/deploy-release.js`, which — in ONE process —
# verifies the manifest, requires HEAD to BE the release with a clean worktree, recomputes both
# digests, imposes the verified region on the child's environment, and deploys the verified
# assembly via `--app`, never mutable source. The workflow invariants allow only a CLOSED set of
# step shapes (exact actions, exact run blocks), because round 3 and 4 proved both orderings and
# blacklists can be talked around: `verb=deploy; npx cdk "$verb"` sailed past a verb regex.
#
# THE HUMAN DEPLOYMENT BINDING IS REAL AS OF 2026-08-02. Both GitHub Environments exist and were
# evidenced read-only via /repos/:owner/:repo/environments: `dev` and `pilot` each carry a custom
# deployment-branch policy whose only entry is `main`, and `pilot` additionally requires the
# designated reviewer (marciozampiron). The `environment:` keys below are the BINDING; the
# protection lives in repository settings, which no workflow can grant itself. Any change to those
# settings invalidates the evidence and must be re-evidenced before the next deploy approval.
# (From 2026-07-31 to 2026-08-02 this header declared the lane ungated, because the repository had
# zero configured Environments — kept as history so the requirement's origin stays visible.)
#
# ONE INHERENT LIMIT, stated rather than hidden: `workflow_dispatch` executes the workflow
# DEFINITION from the branch the operator selects. The identity job constrains the RELEASE, not the
# file; what stops a modified workflow from reaching pilot secrets is the pilot Environment's
# deployment-branch restriction — which now exists and is main-only.
#
# THIS LANE IS NOT YET OPERABLE, by design — activation has prerequisites, each human-gated and
# each refusing loudly while absent (read-only inspection on 2026-08-02 found ZERO secrets and
# ZERO variables in the dev Environment):
#   1. The RELEASE BOOTSTRAPS (aws-bootstrap-and-oidc.md step 12): PER ENVIRONMENT, the three
#      operator-managed policies (gha-deploy boundary, runtime boundary, cfn-exec-release —
#      rendered per tier) and `cdk bootstrap --qualifier cbardev|cbarpil --toolkit-stack-name
#      cba-release-toolkit-<env>` with that tier's execution policy — the enumerated authority
#      the four deployable stacks execute through, one blast radius per tier. Without it the
#      deploy role's assumable targets do not exist and the lane cannot mutate anything.
#   2. The deploy authority: cba-study-coach-gha-deploy-dev (SecurityStack) with its
#      operator-managed boundary and the extended #66 exec policy — a human-gated SecurityStack
#      redeploy — then its ARN published as the dev Environment secret AWS_DEPLOY_ROLE_ARN.
#   3. The dev Environment configuration: AWS_DEPLOY_PREFLIGHT_ROLE_ARN, AWS_REGION,
#      CBA_AUTH_CALLBACK_URLS, CBA_AUTH_LOGOUT_URLS, CBA_AUTH_DOMAIN_PREFIX,
#      CBA_EXPECTED_USER_POOL_ID.
#   4. Zamp's per-release cloud gate: the CBA_CLOUD_GATE Environment variable naming the exact
#      release, assembly digest, decision id, a bounded window (strict RFC3339 UTC, at most one
#      hour) and the REVIEWED PLAN GROUP it covers — first with mode plan_only, which PREPARES
#      one named CloudFormation change set per stack in the group and emits PLAN_DIGEST over
#      their unredacted canonical describes (property values included — the rendering shows the
#      semantics with fingerprinted identifiers); then with mode deploy NAMING that digest, which
#      executes EXACTLY those change sets. A recreated or drifted plan refuses as PLAN_CHANGED;
#      an OBSOLETE change set never receives a digest; CloudFormation itself refuses a change
#      set whose stack moved after preparation. FIRST DEPLOYMENT of a tier runs in dependency
#      WAVES (Identity+Data, then Api, then Observability — each wave planned, reviewed and
#      executed under its own gate) because a change set whose Fn::ImportValue producers are
#      unexecuted cannot even be created; steady state uses the full group in one cycle. No gate, no children.
#
# CREDENTIALS AND PROJECT CODE NEVER SHARE A WINDOW (round 3): synth — which executes project
# code, bundlers and package lifecycles — runs in its own credential-free step BEFORE the OIDC
# consumer in every job. After the consumer, the only thing that executes is the reviewed
# entrypoint (node bin/deploy-preflight.js / node bin/deploy-release.js); a semantic invariant
# refuses npm/npx or any action step after credential acquisition.
name: Release Pilot

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Full 40-character commit SHA to release; must be an ancestor of main'
        required: true
        type: string
      mode:
        description: 'dev_only is the only selectable path in Slice B1 — pilot promotion is mechanically blocked until O1/O2, the smokes and the live SNS/KMS proof are implemented'
        required: true
        type: choice
        options:
          - dev_only

permissions:
  contents: read

# Releases serialize PER ENVIRONMENT (design §1): a LITERAL lock, never derived from inputs — a
# group keyed on release_sha would give two different SHAs two different groups and let them
# mutate dev concurrently. Slice B1 deploys only dev, so the one literal group is release-dev;
# the promotion slice introduces release-pilot alongside it, through review.
concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # GLOBAL PREFLIGHT — release identity only. Binds NO Environment, on purpose: it must not be able
  # to read environment configuration, so a malformed release cannot reach any environment's
  # variables or secrets even by accident. Checkout is pinned to `main` (full history) because the
  # job needs main's object database to prove ancestry — it never checks out the candidate itself.
  # ---------------------------------------------------------------------------------------------
  global-preflight:
    name: Release identity (shape, object type and ancestry)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        id: identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          # Shape FIRST, before any git invocation, and over ALL forty characters: a `[0-9a-f]*`
          # pattern validates only the first one, so "a" followed by 39 "Z"s passed it.
          if [ "${#RELEASE_SHA}" -ne 40 ] || [ -n "${RELEASE_SHA//[0-9a-f]/}" ]; then
            echo "::error::release_sha must be exactly 40 lowercase hex characters — a commit OID, never a ref name"
            exit 1
          fi
          git fetch --quiet origin main
          # The object must BE a commit: a 40-hex tag or blob OID is not a release.
          type=$(git cat-file -t "$RELEASE_SHA" 2>/dev/null || true)
          if [ "$type" != "commit" ]; then
            echo "::error::release_sha does not name a commit object in main's history"
            exit 1
          fi
          resolved=$(git rev-parse --verify "$RELEASE_SHA^{commit}")
          if [ "$resolved" != "$RELEASE_SHA" ]; then
            echo "::error::release_sha did not resolve to itself; refusing an ambiguous name"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$resolved" origin/main; then
            echo "::error::release_sha is not an ancestor of main — only reviewed, merged commits are releasable"
            exit 1
          fi
          # Emit the RESOLVED OID, never the original input: downstream jobs pin to this output,
          # so a ref moved between validation and a later checkout has nothing left to move.
          echo "release_sha=$resolved" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # DEV PREFLIGHT — PREFLIGHT-1 and PREFLIGHT-2 against the dev Environment's own configuration.
  # Context comes from Environment variables, never from the caller; the expected user pool id
  # reaches the evaluator through the environment for the same reason. The step emits the manifest
  # and its digest — the digest covers release, environment, region, target account and every bound
  # context value, so validating one configuration says nothing about any other.
  # ---------------------------------------------------------------------------------------------
  dev-preflight:
    name: Deploy preflight (dev)
    needs: [global-preflight]
    if: needs.global-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      context_digest: ${{ steps.preflight.outputs.context_digest }}
      manifest: ${{ steps.preflight.outputs.manifest }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.global-preflight.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (context helpers and preflight)
        run: npm test
      - name: Synthesize the bound context (credential-free, BEFORE any AWS authority)
        env:
          CBA_AUTH_CALLBACK_URLS: ${{ vars.CBA_AUTH_CALLBACK_URLS }}
          CBA_AUTH_LOGOUT_URLS: ${{ vars.CBA_AUTH_LOGOUT_URLS }}
          CBA_AUTH_DOMAIN_PREFIX: ${{ vars.CBA_AUTH_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          npm run synth:quiet -- \
            -c environment=dev \
            -c "authCallbackUrls=$CBA_AUTH_CALLBACK_URLS" \
            -c "authLogoutUrls=$CBA_AUTH_LOGOUT_URLS" \
            -c "authDomainPrefix=$CBA_AUTH_DOMAIN_PREFIX"
      - name: Configure AWS credentials (read-only preflight role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Evaluate PREFLIGHT-1 and PREFLIGHT-2
        id: preflight
        env:
          RELEASE_SHA: ${{ needs.global-preflight.outputs.release_sha }}
          TARGET_REGION: ${{ vars.AWS_REGION }}
          CBA_AUTH_CALLBACK_URLS: ${{ vars.CBA_AUTH_CALLBACK_URLS }}
          CBA_AUTH_LOGOUT_URLS: ${{ vars.CBA_AUTH_LOGOUT_URLS }}
          CBA_AUTH_DOMAIN_PREFIX: ${{ vars.CBA_AUTH_DOMAIN_PREFIX }}
          CBA_EXPECTED_USER_POOL_ID: ${{ secrets.CBA_EXPECTED_USER_POOL_ID }}
        run: |
          set -euo pipefail
          node bin/deploy-preflight.js \
            --environment dev \
            --release-sha "$RELEASE_SHA" \
            --region "$TARGET_REGION" \
            --assembly cdk.out \
            --manifest-out "$RUNNER_TEMP/preflight-dev.json" \
            -c "authCallbackUrls=$CBA_AUTH_CALLBACK_URLS" \
            -c "authLogoutUrls=$CBA_AUTH_LOGOUT_URLS" \
            -c "authDomainPrefix=$CBA_AUTH_DOMAIN_PREFIX"
          digest=$(node -e 'process.stdout.write(require(process.argv[1]).contextDigest)' "$RUNNER_TEMP/preflight-dev.json")
          echo "context_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "manifest=$(node -e 'process.stdout.write(JSON.stringify(require(process.argv[1])))' "$RUNNER_TEMP/preflight-dev.json")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # DEV STAGE — SLICE B1: the sanctioned AWS deploy of the dev tier.
  #
  # Deployment happens ONLY through infra/aws/bin/deploy-release.js. In one process it validates
  # the manifest's closed schema, requires HEAD to BE the release with a clean worktree, snapshots
  # the freshly synthesized assembly, recomputes BOTH digests (context: release+environment+region+
  # account+bound values; assembly: every regular file), re-resolves the account immediately before
  # the effect, validates Zamp's CLOUD GATE (CBA_CLOUD_GATE — an Environment variable naming the
  # exact release, the exact assembly digest, a plan_only|deploy mode, a bounded window and — for
  # deploy — the PLAN_DIGEST of the reviewed change sets), and then: plan_only PREPARES one named
  # change set per stack from the private snapshot (--exclusively over the closed set, never
  # --all — the account-global SecurityStack and the deferred AiOrchestrationStack are
  # structurally outside the release blast radius) and puts the digest of their unredacted
  # canonical describes on the record; deploy re-describes those exact change sets, requires the
  # digest the gate names, and EXECUTES them in the reviewed dependency order under this tier's
  # assumed bootstrap role, re-checking window and account immediately before each mutation.
  # Everything a child prints is sanitized by shape (ARNs, URLs, pool ids, account digits) before
  # it reaches this log. A re-synth that differs from what the preflight digested REFUSES — determinism is
  # verified, never assumed. This is the only stage job holding id-token: write, because it is the
  # only stage job with the pinned OIDC consumer; AWS_DEPLOY_ROLE_ARN is the canonical
  # Environment-scoped deploy-role secret (design §3), distinct from the read-only preflight
  # role's secret. Raw deploy commands remain forbidden everywhere by the closed step shapes.
  # ---------------------------------------------------------------------------------------------
  dev-stage:
    name: Dev stage — deploy AWS (dev)
    needs: [global-preflight, dev-preflight]
    if: needs.dev-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.global-preflight.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Synthesize the bound context (credential-free, BEFORE any AWS authority)
        env:
          CBA_AUTH_CALLBACK_URLS: ${{ vars.CBA_AUTH_CALLBACK_URLS }}
          CBA_AUTH_LOGOUT_URLS: ${{ vars.CBA_AUTH_LOGOUT_URLS }}
          CBA_AUTH_DOMAIN_PREFIX: ${{ vars.CBA_AUTH_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          npm run synth:quiet -- \
            -c environment=dev \
            -c "authCallbackUrls=$CBA_AUTH_CALLBACK_URLS" \
            -c "authLogoutUrls=$CBA_AUTH_LOGOUT_URLS" \
            -c "authDomainPrefix=$CBA_AUTH_DOMAIN_PREFIX"
      - name: Configure AWS credentials (dev deploy role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Deploy the verified release through the sanctioned entrypoint
        env:
          RELEASE_SHA: ${{ needs.global-preflight.outputs.release_sha }}
          TARGET_REGION: ${{ vars.AWS_REGION }}
          MANIFEST_JSON: ${{ needs.dev-preflight.outputs.manifest }}
          CBA_CLOUD_GATE: ${{ vars.CBA_CLOUD_GATE }}
          CBA_AUTH_CALLBACK_URLS: ${{ vars.CBA_AUTH_CALLBACK_URLS }}
          CBA_AUTH_LOGOUT_URLS: ${{ vars.CBA_AUTH_LOGOUT_URLS }}
          CBA_AUTH_DOMAIN_PREFIX: ${{ vars.CBA_AUTH_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST_JSON" > "$RUNNER_TEMP/manifest.json"
          node bin/deploy-release.js \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --environment dev \
            --release-sha "$RELEASE_SHA" \
            --region "$TARGET_REGION" \
            --assembly cdk.out \
            -c "authCallbackUrls=$CBA_AUTH_CALLBACK_URLS" \
            -c "authLogoutUrls=$CBA_AUTH_LOGOUT_URLS" \
            -c "authDomainPrefix=$CBA_AUTH_DOMAIN_PREFIX"

  # ---------------------------------------------------------------------------------------------
  # PILOT PREFLIGHT — reachable ONLY through a green dev stage, and only when the operator asked
  # for promotion. There is no dispatch path that selects pilot directly.
  # ---------------------------------------------------------------------------------------------
  pilot-preflight:
    name: Deploy preflight (pilot)
    needs: [global-preflight, dev-preflight, dev-stage]
    if: needs.dev-stage.result == 'success' && inputs.mode == 'dev_then_pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pilot
    permissions:
      contents: read
      id-token: write
    outputs:
      context_digest: ${{ steps.preflight.outputs.context_digest }}
      manifest: ${{ steps.preflight.outputs.manifest }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.global-preflight.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Synthesize the bound context (credential-free, BEFORE any AWS authority)
        env:
          CBA_AUTH_CALLBACK_URLS: ${{ vars.CBA_AUTH_CALLBACK_URLS }}
          CBA_AUTH_LOGOUT_URLS: ${{ vars.CBA_AUTH_LOGOUT_URLS }}
          CBA_AUTH_DOMAIN_PREFIX: ${{ vars.CBA_AUTH_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          npm run synth:quiet -- \
            -c environment=pilot \
            -c "authCallbackUrls=$CBA_AUTH_CALLBACK_URLS" \
            -c "authLogoutUrls=$CBA_AUTH_LOGOUT_URLS" \
            -c "authDomainPrefix=$CBA_AUTH_DOMAIN_PREFIX"
      - name: Configure AWS credentials (read-only preflight role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Evaluate PREFLIGHT-1 and PREFLIGHT-2
        id: preflight
        env:
          RELEASE_SHA: ${{ needs.global-preflight.outputs.release_sha }}
          TARGET_REGION: ${{ vars.AWS_REGION }}
          CBA_AUTH_CALLBACK_URLS: ${{ vars.CBA_AUTH_CALLBACK_URLS }}
          CBA_AUTH_LOGOUT_URLS: ${{ vars.CBA_AUTH_LOGOUT_URLS }}
          CBA_AUTH_DOMAIN_PREFIX: ${{ vars.CBA_AUTH_DOMAIN_PREFIX }}
          CBA_EXPECTED_USER_POOL_ID: ${{ secrets.CBA_EXPECTED_USER_POOL_ID }}
        run: |
          set -euo pipefail
          node bin/deploy-preflight.js \
            --environment pilot \
            --release-sha "$RELEASE_SHA" \
            --region "$TARGET_REGION" \
            --assembly cdk.out \
            --manifest-out "$RUNNER_TEMP/preflight-pilot.json" \
            -c "authCallbackUrls=$CBA_AUTH_CALLBACK_URLS" \
            -c "authLogoutUrls=$CBA_AUTH_LOGOUT_URLS" \
            -c "authDomainPrefix=$CBA_AUTH_DOMAIN_PREFIX"
          digest=$(node -e 'process.stdout.write(require(process.argv[1]).contextDigest)' "$RUNNER_TEMP/preflight-pilot.json")
          echo "context_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "manifest=$(node -e 'process.stdout.write(JSON.stringify(require(process.argv[1])))' "$RUNNER_TEMP/preflight-pilot.json")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # PILOT STAGE — SLICE A PLACEHOLDER. Runs no deployment of any kind.
  # ---------------------------------------------------------------------------------------------
  pilot-stage:
    name: Pilot stage (not implemented in Slice A)
    needs: [global-preflight, dev-stage, pilot-preflight]
    if: needs.pilot-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pilot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.global-preflight.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify the preflight manifest
        env:
          RELEASE_SHA: ${{ needs.global-preflight.outputs.release_sha }}
          CONTEXT_DIGEST: ${{ needs.pilot-preflight.outputs.context_digest }}
          MANIFEST_JSON: ${{ needs.pilot-preflight.outputs.manifest }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST_JSON" > "$RUNNER_TEMP/manifest.json"
          node infra/aws/bin/deploy-preflight.js verify-manifest \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --environment pilot \
            --release-sha "$RELEASE_SHA" \
            --expect-digest "$CONTEXT_DIGEST"
      - name: Slice A stops here
        run: |
          echo "Slice A implements no deployment step: no AWS stack, no Cloudflare Worker,"
          echo "no account mutation and no paid call happened in this run."
